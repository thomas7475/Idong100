[package]
name = "idong"
description = "Pure-Rust protocol core + optional rusb transport for the Toltech i-Dong Sensor V2.6"
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/thomas7475/Idong100"

# Single crate (turn 37): the pure core AND the rusb transport live in
# one src/ tree with ONE version to manage. The transport needs libusb,
# so it is a cargo feature; plain `cargo test` stays hardware-free.
#
# Turn 39: ALL code lives under src/ - the lib in `src/`, the examples in
# `src/examples/`, the integration tests in `src/tests/` (one tree to
# manage, nothing outside it). Cargo reaches them through the explicit
# `[[example]]` / `[[test]]` path targets below, so the commands are
# unchanged: `cargo run --features usb --example bringup` etc.
#
# Turn 40: the crate lives in `software/` of the repository (run cargo
# from there). The vendor device files ship next to it in
# `software/firmware/` - `src/firmware.rs` locates that folder, so
# `cargo run --features usb --example flash_mcu` needs no `--hex`.
#
# idong-ros2 / idong_msgs remain separate colcon packages (excluded here;
# they are built by colcon-ros-cargo with the generated message crate).

[features]
default = []
# The rusb/libusb transport (src/transport/usb.rs) + the live examples
# (list, probe_bootloader, bringup). Build on the bench:
#   cargo run --features usb --example bringup
usb = ["dep:rusb"]

[dependencies]
thiserror = "2"
log = "0.4"
crossbeam-channel = "0.5"
rusb = { version = "0.9", optional = true }

# Examples only (src/examples/video.rs: the V4L2 ioctl layer + PNG output).
# Plain `cargo test` stays hardware-free - these never enter the lib build.
[dev-dependencies]
libc = "0.2"
png = "0.17"

# ---- examples (src/examples/, turn 39 - explicit paths) ----
# Every example compiles in BOTH feature states (the usb ones print a
# build hint without the feature), so none sets required-features.
[[example]]
name = "list"
path = "src/examples/list.rs"

[[example]]
name = "probe_bootloader"
path = "src/examples/probe_bootloader.rs"

[[example]]
name = "bringup"
path = "src/examples/bringup.rs"

[[example]]
name = "session_full"
path = "src/examples/session_full.rs"

[[example]]
name = "video"
path = "src/examples/video.rs"

[[example]]
name = "flash_mcu"
path = "src/examples/flash_mcu.rs"

[[example]]
name = "mcu_image"
path = "src/examples/mcu_image.rs"

[[example]]
name = "dump_frames"
path = "src/examples/dump_frames.rs"

# ---- integration tests (src/tests/, turn 39 - explicit paths) ----
[[test]]
name = "mock_replay"
path = "src/tests/mock_replay.rs"

[[test]]
name = "runtime_replay"
path = "src/tests/runtime_replay.rs"

[[test]]
name = "video_golden"
path = "src/tests/video_golden.rs"

# turn 40: the vendor files shipped in software/firmware/ - every hash,
# the driver pins, the vendor file map, the folder lookup
[[test]]
name = "firmware_files"
path = "src/tests/firmware_files.rs"

[profile.release]
debug = true  # keep symbols for on-device diagnosis
