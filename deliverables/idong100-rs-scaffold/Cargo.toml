[workspace]
resolver = "2"
members = ["idong", "idong-transport", "idong-ros2"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/thomas7475/Idong100"

[workspace.dependencies]
thiserror = "2"
byteorder = "1"
crossbeam-channel = "0.5"
log = "0.4"
rusb = "0.9"

[profile.release]
debug = true  # keep symbols for on-device diagnosis
