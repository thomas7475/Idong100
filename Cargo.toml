[workspace]
resolver = "2"
# P1: the pure core + the rusb transport are workspace members.
# idong-ros2 joins at P4 (it needs idong_msgs, generated by
# colcon-ros-cargo at build time - excluded until then so plain
# `cargo check` works without a ROS installation).
members = ["idong", "idong-transport"]
exclude = ["idong-ros2"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/thomas7475/Idong100"

[workspace.dependencies]
thiserror = "2"
crossbeam-channel = "0.5"
log = "0.4"
rusb = "0.9"

[profile.release]
debug = true  # keep symbols for on-device diagnosis
