[package]
name = "idong"
description = "Pure-Rust protocol core + optional rusb transport for the Toltech i-Dong Sensor V2.6"
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/thomas7475/Idong100"

# Single crate (turn 37): the pure core AND the rusb transport live in
# one src/ tree with ONE version to manage. The transport needs libusb,
# so it is a cargo feature; plain `cargo test` stays hardware-free.
#
# idong-ros2 / idong_msgs remain separate colcon packages (excluded here;
# they are built by colcon-ros-cargo with the generated message crate).

[features]
default = []
# The rusb/libusb transport (src/transport/usb.rs) + the live examples
# (list, probe_bootloader, bringup). Build on the bench:
#   cargo run --features usb --example bringup
usb = ["dep:rusb"]

[dependencies]
thiserror = "2"
log = "0.4"
crossbeam-channel = "0.5"
rusb = { version = "0.9", optional = true }

# Examples only (examples/video.rs: the V4L2 ioctl layer + PNG output).
# Plain `cargo test` stays hardware-free - these never enter the lib build.
[dev-dependencies]
libc = "0.2"
png = "0.17"

[profile.release]
debug = true  # keep symbols for on-device diagnosis
